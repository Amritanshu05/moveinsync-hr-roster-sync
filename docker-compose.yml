version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: moveinsync-postgres
    restart: always
    environment:
      POSTGRES_DB: moveinsync_roster
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d moveinsync_roster"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - moveinsync-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: moveinsync-roster-app
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/moveinsync_roster
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    networks:
      - moveinsync-net

volumes:
  postgres_data:

networks:
  moveinsync-net:
    driver: bridge
