# ============================================================
# application-test.yml — Testcontainers / Integration Test Profile
# DataSource is overridden at runtime by @DynamicPropertySource
# ============================================================
spring:
  datasource:
    # Placeholder — overridden by AbstractPostgresIntegrationTest via @DynamicPropertySource
    url: jdbc:postgresql://localhost:5432/test
    username: test
    password: test
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 10000
      auto-commit: false

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  # Disable scheduled outbox polling — integration tests trigger it manually
  task:
    scheduling:
      enabled: false

# Outbox settings optimised for tests
moveinsync:
  outbox:
    polling-interval-ms: 999999999   # effectively disabled in tests
    batch-size: 50
    max-retry-count: 3
    lease-duration-seconds: 2        # very short so lease-recovery tests work quickly

  reconciliation:
    safety-brake-threshold: 0.30
    streaming-batch-size: 500

  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 3600000

logging:
  level:
    com.moveinsync: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.flywaydb: WARN

