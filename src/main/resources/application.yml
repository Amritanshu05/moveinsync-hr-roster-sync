server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: moveinsync-hr-roster-sync
  profiles:
    active: default

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/moveinsync_roster}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: MoveInSyncHikariPool
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:20}
      minimum-idle: 5
      auto-commit: false
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        show_sql: false
        jdbc:
          batch_size: 50
          order_inserts: true
          order_updates: true
        connection:
          provider_disables_autocommit: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    locations: classpath:db/migration

  cache:
    type: caffeine
    cache-names:
      - employee_cache
      - offices_cache
      - tenant_cache

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

# Custom MoveInSync Domain Configurations
moveinsync:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000 # 24 hours
  reconciliation:
    safety-brake-threshold: 0.30 # Missing >= 30% triggers safety brake
    streaming-batch-size: 2000
  outbox:
    polling-interval-ms: 1000
    batch-size: 100
    max-retry-count: 5

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        roster.reconciliation.duration: true
        roster.events.processing.time: true
